name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build
        # VITE_MMO_URL is read by src/game/net/config.ts at build time.
        # Set the `VITE_MMO_URL` repo variable (Settings → Secrets and
        # variables → Actions → Variables) once the server has a
        # public endpoint. Unset → the client falls back to
        # ws://localhost:8080 (multiplayer won't work on Pages, but
        # the build still succeeds).
        env:
          VITE_MMO_URL: ${{ vars.VITE_MMO_URL }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
